<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>굿즈샵</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3182f6" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="turingshop" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">굿즈샵</a>
      <div id="nav"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">나만의 작은 굿즈샵</h1>
        <p class="hero-subtitle">스티커, 에코백, 키링까지 — 마음에 드는 굿즈를 골라보세요.</p>
        <a href="shop.html" class="btn hero-cta">상품 구경하기</a>
      </div>
    </section>

    <section class="container">
      <h2 class="section-title">상품 둘러보기</h2>
      <div id="landingProductGrid" class="product-grid"></div>
    </section>

    <section class="container">
      <div class="feature-grid">
        <div class="feature-card">
          <div class="feature-title">간편 가입</div>
          <div class="feature-desc">이메일만 있으면 인증 절차 없이 바로 가입, 바로 이용</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">안전한 테스트 결제</div>
          <div class="feature-desc">토스페이먼츠 테스트 모드 — 실제 카드/청구 없이 결제 체험</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">내 주문 확인</div>
          <div class="feature-desc">로그인 후 언제든 내 결제 내역을 확인할 수 있어요</div>
        </div>
      </div>
    </section>
  </main>

  <div id="detailModal" class="modal-overlay" hidden>
    <div class="modal">
      <img id="detailImage" class="detail-image" src="" alt="" />
      <h2 class="modal-title" id="detailName"></h2>
      <p class="product-price" id="detailPrice"></p>
      <p class="muted" id="detailDescription"></p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="closeDetail">닫기</button>
        <a href="shop.html" class="btn">구매하러 가기</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
