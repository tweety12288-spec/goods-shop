<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>굿즈샵 - 결제 처리 중</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <div class="card" style="max-width: 420px; margin: 60px auto; text-align:center;">
      <p id="statusText">결제를 승인하고 있습니다...</p>
      <div class="modal-actions" id="actions" hidden>
        <a href="orders.html" class="btn block">내 주문 보기</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    async function confirmPayment() {
      const statusText = document.getElementById("statusText");
      const actions = document.getElementById("actions");

      const params = new URLSearchParams(location.search);
      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = params.get("amount");

      if (!paymentKey || !orderId || !amount) {
        statusText.textContent = "잘못된 접근입니다.";
        return;
      }

      const {
        data: { session },
      } = await supabaseClient.auth.getSession();

      if (!session) {
        statusText.textContent = "로그인이 필요합니다.";
        return;
      }

      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/confirm-payment`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${session.access_token}`,
            apikey: SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ paymentKey, orderId, amount }),
        },
      );

      const data = await res.json();

      if (!res.ok || data.error) {
        statusText.textContent = "결제 승인에 실패했습니다: " + (data.error ?? "알 수 없는 오류");
        return;
      }

      statusText.textContent = "결제가 완료되었습니다!";
      actions.hidden = false;
    }

    confirmPayment();
  </script>
</body>
</html>
