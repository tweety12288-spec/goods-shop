<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>굿즈샵 - 로그인</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">굿즈샵</a>
      <div id="nav"></div>
    </div>
  </header>

  <main class="container">
    <div class="card" style="max-width: 420px; margin: 40px auto;">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">로그인</button>
        <button type="button" class="tab" data-tab="signup">회원가입</button>
      </div>

      <form id="loginForm" class="form">
        <div class="field">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </div>
        <p class="error-text" id="loginError"></p>
        <button type="submit" class="btn block">로그인</button>
      </form>

      <form id="signupForm" class="form" hidden>
        <div class="field">
          <label for="signupEmail">이메일</label>
          <input type="email" id="signupEmail" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="signupPassword">비밀번호</label>
          <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <p class="muted">가입 즉시 로그인됩니다 (이메일 인증 없음)</p>
        <p class="error-text" id="signupError"></p>
        <button type="submit" class="btn block">회원가입</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
