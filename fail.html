<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>굿즈샵 - 결제 실패</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3182f6" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="turingshop" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <div class="card" style="max-width: 420px; margin: 60px auto; text-align:center;">
      <p id="statusText">결제에 실패했습니다.</p>
      <p class="muted" id="reasonText"></p>
      <div class="modal-actions">
        <a href="shop.html" class="btn block">상품 목록으로</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const message = params.get("message");
    if (message) {
      document.getElementById("reasonText").textContent = decodeURIComponent(message);
    }
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
