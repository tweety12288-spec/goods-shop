<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>굿즈샵 - 상품 목록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="shop.html" class="brand">굿즈샵</a>
      <div id="nav"></div>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size:1.25rem;">상품 목록</h1>
    <div id="productGrid" class="product-grid"></div>
    <p id="emptyState" class="empty-state" hidden>등록된 상품이 없습니다.</p>
  </main>

  <div id="buyModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 class="modal-title" id="modalProductName"></h2>
      <p class="muted" id="modalProductPrice"></p>

      <form id="buyForm" class="form">
        <div class="field">
          <label for="quantity">수량</label>
          <input type="number" id="quantity" min="1" value="1" required />
        </div>
        <div class="field">
          <label for="shippingName">받는 분 성함</label>
          <input type="text" id="shippingName" required />
        </div>
        <div class="field">
          <label for="shippingPhone">연락처</label>
          <input type="tel" id="shippingPhone" required placeholder="010-0000-0000" />
        </div>
        <div class="field">
          <label for="shippingAddress">배송 주소</label>
          <textarea id="shippingAddress" required></textarea>
        </div>
        <p class="error-text" id="buyError"></p>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelBuy">취소</button>
          <button type="submit" class="btn">결제하기</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
